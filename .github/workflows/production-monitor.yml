name: Production Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production health
        run: npm run check:production-health

      - name: Telegram failure
        if: failure() && secrets.CRON_SECRET != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "https://www.newukrainedaily.com/api/internal/telegram" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"status":"error","title":"Production health failed","text":"Production health monitor failed."}'

  publishing-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check latest published news freshness
        run: npm run check:production-publishing -- --max-hours-without-news=24 --min-items=1

      - name: Telegram failure
        if: failure() && secrets.CRON_SECRET != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "https://www.newukrainedaily.com/api/internal/telegram" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"status":"error","title":"Publishing freshness failed","text":"No fresh published news within threshold."}'
