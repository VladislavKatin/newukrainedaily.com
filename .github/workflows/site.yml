name: Update and deploy site

# Every hour: run the content automation against the database, then rebuild the
# static site and upload it to Cloudflare Pages - but only if the content changed
# (Cloudflare Pages free plan: 500 deploys a month). Also runs on every push to main.
# GitHub's own schedule is unreliable (it skipped most hours), so the hourly run is
# started by the Cloudflare Worker "newukrainedaily-cron" (workflow_dispatch with
# scheduled=true); see cron-worker/worker.js.

on:
  # No GitHub `schedule:` trigger: the Cloudflare Worker starts the hourly run.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate:
        description: "Generate a new article in this run"
        type: boolean
        default: false
      scheduled:
        description: "Hourly run started by the Cloudflare cron worker"
        type: boolean
        default: false
      task:
        description: "Optional maintenance task, e.g. fix-years --slug=<slug> --year=2023"
        type: string
        default: ""

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  PAGES_PROJECT: newukrainedaily
  PUBLIC_BASE_URL: https://www.newukrainedaily.com
  AI_PROVIDER: openai
  DAILY_PUBLISH_LIMIT: "10"
  AUTOPOST_DRY_RUN: "false"
  FETCH_SOURCES_LIMIT: "20"
  FETCH_ITEMS_PER_SOURCE_LIMIT: "15"
  REWRITE_BATCH_LIMIT: "2"
  REWRITE_REQUEST_SPACING_MS: "1500"
  IMAGE_BATCH_LIMIT: "1"
  IMAGE_MAX_ATTEMPTS: "3"
  IMAGE_STALE_MINUTES: "60"
  IMAGE_REQUEST_SPACING_MS: "2500"
  PUBLISH_BATCH_LIMIT: "5"
  PG_POOL_MAX: "2"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  AI_API_KEY: ${{ secrets.AI_API_KEY }}
  LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
  LEONARDO_WEBHOOK_SECRET: ${{ secrets.LEONARDO_WEBHOOK_SECRET }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
  # Images go to the R2 bucket behind cdn.newukrainedaily.com (uploaded with CLOUDFLARE_API_TOKEN).
  # Supabase Storage is no longer used: the free plan egress quota is exhausted.
  R2_BUCKET: newukrainedaily-generated
  R2_PUBLIC_BASE_URL: https://cdn.newukrainedaily.com
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
  GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decide what to run
        id: plan
        run: |
          hour=$((10#$(date -u +%H)))
          generate=false
          # 10 articles a day: every even UTC hour from 00 to 18 (same schedule as on Vercel).
          hourly=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.scheduled }}" = "true" ]; then hourly=true; fi
          if [ "$hourly" = "true" ] && [ $((hour % 2)) -eq 0 ] && [ "$hour" -le 18 ]; then generate=true; fi
          if [ "${{ inputs.generate }}" = "true" ]; then generate=true; fi
          automation=true
          if [ "${{ github.event_name }}" = "push" ]; then automation=false; fi
          echo "generate=$generate" >> "$GITHUB_OUTPUT"
          echo "automation=$automation" >> "$GITHUB_OUTPUT"
          echo "hour=$hour" >> "$GITHUB_OUTPUT"
          echo "hourly=$hourly" >> "$GITHUB_OUTPUT"
          echo "generate=$generate automation=$automation hour=$hour"

      - name: Ensure database tables
        if: steps.plan.outputs.automation == 'true'
        run: npm run auto -- ensure-schema

      - name: Maintenance task (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.task != ''
        env:
          MAINTENANCE_TASK: ${{ inputs.task }}
        # Unquoted on purpose: split into the task name and its --flags (no shell evaluation).
        run: npm run auto -- $MAINTENANCE_TASK

      - name: Generate article (fetch, rewrite, image, publish)
        id: generate
        if: steps.plan.outputs.generate == 'true'
        continue-on-error: true
        run: |
          npm run auto -- generate --count=1
          sleep 90

      - name: Finalize images and publish
        id: publish
        if: steps.plan.outputs.automation == 'true'
        continue-on-error: true
        run: |
          npm run auto -- images
          npm run auto -- publish

      - name: World digest (once per Kyiv day)
        if: steps.plan.outputs.automation == 'true' && steps.plan.outputs.hour >= 3
        continue-on-error: true
        run: npm run auto -- world-digest

      - name: SEO refresh (daily)
        if: steps.plan.outputs.automation == 'true' && steps.plan.outputs.hour == 1
        continue-on-error: true
        run: npm run auto -- seo-refresh

      - name: Move old Supabase images to R2 (daily)
        if: steps.plan.outputs.automation == 'true' && steps.plan.outputs.hour == 2
        continue-on-error: true
        run: npm run auto -- repair-images --limit=300

      - name: Content fingerprint
        id: fingerprint
        if: steps.plan.outputs.hourly == 'true'
        continue-on-error: true
        run: npm run auto -- fingerprint

      - name: Was this content already deployed?
        id: deployed
        if: steps.plan.outputs.hourly == 'true' && steps.fingerprint.outputs.fingerprint != ''
        uses: actions/cache/restore@v4
        with:
          path: .deploy-marker
          key: deployed-${{ github.sha }}-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - name: Build static site
        id: build
        if: steps.deployed.outputs.cache-hit != 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.build.outcome == 'success'
        run: npx --yes wrangler@4 pages deploy out --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true

      - name: Health check
        if: steps.build.outcome == 'success'
        run: |
          sleep 20
          npm run check:production-health

      - name: Remember deployed content
        if: steps.build.outcome == 'success' && steps.fingerprint.outputs.fingerprint != ''
        continue-on-error: true
        run: mkdir -p .deploy-marker && echo "${{ steps.fingerprint.outputs.fingerprint }}" > .deploy-marker/fingerprint

      - name: Save deploy marker
        if: steps.build.outcome == 'success' && steps.fingerprint.outputs.fingerprint != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .deploy-marker
          key: deployed-${{ github.sha }}-${{ steps.fingerprint.outputs.fingerprint }}

      - name: Nothing changed
        if: steps.deployed.outputs.cache-hit == 'true'
        run: echo "Content unchanged since the last deploy - build and deploy skipped."

      - name: Keep scheduled runs enabled
        if: steps.plan.outputs.hourly == 'true' && steps.plan.outputs.hour == 4
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/site.yml/enable"

      - name: Telegram on automation problems
        if: steps.generate.outcome == 'failure' || steps.publish.outcome == 'failure'
        continue-on-error: true
        run: >-
          node scripts/telegram-notify.mjs --status=warning
          --title="Автоматика сайта: шаг с ошибкой"
          --text="Сайт обновлён, но генерация или публикация статей упала. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram on failure
        if: failure()
        continue-on-error: true
        run: >-
          node scripts/telegram-notify.mjs --status=error
          --title="Сбой обновления сайта"
          --text="GitHub Actions: шаг упал. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
