name: Release Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run release check
        run: npm run release:check

      - name: Telegram success
        if: success() && github.event_name != 'pull_request' && secrets.CRON_SECRET != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "https://www.newukrainedaily.com/api/internal/telegram" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"status":"success","title":"Release check passed","text":"release:check completed successfully on main."}'

      - name: Telegram failure
        if: failure() && github.event_name != 'pull_request' && secrets.CRON_SECRET != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "https://www.newukrainedaily.com/api/internal/telegram" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"status":"error","title":"Release check failed","text":"release:check failed on main."}'
